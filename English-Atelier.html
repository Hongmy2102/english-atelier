        "noun": "mobilisation",
        "verb": "mobilise",
        "adjective": "mobilised",
        "meaning": "sự huy động / huy động / được huy động",
        "example": "Community groups can mobilise volunteers for a public discussion."
      }
    ],
    "paragraph": "Young people may use public demonstrations to express concerns that they believe political institutions have overlooked. However, the presence of young participants does not by itself show that a movement represents an entire generation. To assess such a claim, readers need evidence about who participated, what they demanded and how the information was collected.",
    "grammar": [

        "rule": "Mệnh đề quan hệ có cụm they believe xen trong cấu trúc.",
        "note": "Political institutions là chủ ngữ của have overlooked. That quy chiếu về concerns, tân ngữ được bỏ trống sau overlooked."
      },
      {
        "quote": "does not by itself show that a movement represents",
        "rule": "Does not + V; that + mệnh đề làm tân ngữ của show.",
        "note": "By itself nhấn mạnh bằng chứng đó riêng lẻ chưa đủ; không có nghĩa là khẳng định ấy chắc chắn sai."

      {

    "source": "Chủ đề bổ sung do website biên soạn theo yêu cầu của bạn. Chưa có bài báo hiện tại được xác minh; đoạn mẫu không mô tả một sự kiện cụ thể."
  }
];

</script><script>
'use strict';
const C=window.COURSE, KEY='english-atelier-v1';
const empty=()=>({version:1,reviews:{},drafts:{task1:'',task2:''},checks:{},articles:[],topicDrafts:{}});
let state=empty(), storageOK=true;
try{const raw=localStorage.getItem(KEY);if(raw) state=validate(JSON.parse(raw));}catch(e){storageOK=false;}
function validate(s){if(!s||s.version!==1||!s.reviews||!s.drafts||!s.checks||typeof s.reviews!=='object'||Array.isArray(s.reviews)||typeof s.checks!=='object'||Array.isArray(s.checks))throw Error('Sai định dạng dữ liệu');const out=empty();for(const w of C.words){const r=s.reviews[w.id];if(r){if(!Number.isFinite(r.due)||!Number.isInteger(r.level)||r.level<0||r.level>5)throw Error('Lịch ôn không hợp lệ');out.reviews[w.id]={due:r.due,level:r.level};}}for(const k of ['task1','task2']){if(typeof s.drafts[k]!=='string'||s.drafts[k].length>200000)throw Error('Bài viết không hợp lệ');out.drafts[k]=s.drafts[k];}for(let i=0;i<8;i++)out.checks[i]=s.checks[i]===true;if(s.topicDrafts!==undefined){if(!s.topicDrafts||typeof s.topicDrafts!=='object'||Array.isArray(s.topicDrafts))throw Error('Bản nháp chủ đề không hợp lệ');for(const t of C.topics){const v=s.topicDrafts[t.id];if(v!==undefined){if(typeof v!=='string'||v.length>200000)throw Error('Bản nháp chủ đề quá dài hoặc sai định dạng');out.topicDrafts[t.id]=v;}}}if(s.articles!==undefined){if(!Array.isArray(s.articles)||s.articles.length>100)throw Error('Nhật ký bài đọc không hợp lệ');out.articles=s.articles.map(a=>{if(!a||typeof a!=='object')throw Error('Bài đọc không hợp lệ');const clean={};for(const k of ['title','url','topic','published','added','summary','words','grammar','prompt']){if(typeof a[k]!=='string'||a[k].length>10000)throw Error('Trường bài đọc không hợp lệ');clean[k]=a[k];}clean.url=safeURL(clean.url);return clean;});}return out;}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tell(msg){$('#notice').textContent=msg;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;tell('Trình duyệt không cho lưu hoặc đã hết dung lượng. Hãy xuất bản sao lưu trước khi đóng trang.');}}
const due=()=>C.words.filter(w=>!state.reviews[w.id]||state.reviews[w.id].due<=Date.now());
function title(k,t,d){return `<div class="page-title"><span class="label">${k}</span><h1>${t}</h1><p class="subtle">${d}</p></div>`;}
const topicOptions=()=>'<option value="">Tất cả chủ đề</option>'+C.topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
function home(){const seen=Object.keys(state.reviews).length;const icons=['🎓','🌱','💻','💼','🏙','🍎','📣','⚖','🎨','🖼','🏛','🔭','🐾','🦋','🌍'];return `<section class="directory-hero"><span class="label">ENGLISH IN LIFE · IELTS ACADEMIC</span><h1>Hiểu thế giới.<br>Viết nên góc nhìn của mình.</h1><p class="lead"><b>EN:</b> Explore a topic, connect words and grammar, then express your own ideas.<br><b>VI:</b> Chọn một chủ đề, nối từ vựng với ngữ pháp, rồi tự viết bằng góc nhìn của bạn.</p><div class="row"><span class="pill">Mục tiêu IELTS 7.0–8.0</span><span class="pill">${C.topics.length} chủ đề · ${C.words.length} cụm từ</span><span class="pill">Mindmap danh–động–tính</span><span class="pill">Luyện viết có khung</span></div></section><section class="learning-steps" aria-label="Cách học một chủ đề">${[['01','Khám phá','Chọn câu hỏi bạn muốn hiểu.'],['02','Kết nối từ','Danh–động–tính và cụm từ.'],['03','Đọc & phân tích','Nhìn ngữ pháp trong đoạn văn.'],['04','Tự diễn đạt','Viết, tự sửa và ôn lại.']].map(([n,h,p])=>`<div><span>${n}</span><h3>${h}</h3><p>${p}</p></div>`).join('')}</section><div class="section-head"><div><span class="label">TOPICS · CHỦ ĐỀ CUỘC SỐNG</span><h2>Bạn muốn khám phá điều gì?</h2><p class="subtle">Mở một chủ đề để học từ, đọc đoạn mẫu và viết trong cùng một không gian.</p></div></div><section class="topic-directory">${C.topics.map((t,i)=>`<a class="topic-tile" href="#topics/${encodeURIComponent(t.id)}" data-lesson="${t.id}"><span class="topic-icon" aria-hidden="true">${icons[i]||'◈'}</span><span class="topic-number">${String(i+1).padStart(2,'0')}</span><h3>${t.name}</h3><p>${t.id} · 6 cụm từ · 1 đoạn mẫu</p><span class="topic-open">Khám phá chủ đề →</span></a>`).join('')}</section><div class="hint"><strong>Học trong ngữ cảnh:</strong> ví dụ và bài tập được biên soạn riêng từ chủ đề đã tham khảo. Phần tin thời sự chỉ có thể xác nhận sau khi đọc được nguồn; các đoạn mẫu chưa phải tường thuật tin mới.</div><section class="stats"><div class="stat"><strong>${seen}</strong><span>Cụm từ đã luyện</span></div><div class="stat"><strong>${due().length}</strong><span>Thẻ mới hoặc đến lịch ôn</span></div><div class="stat"><strong>${Object.keys(state.topicDrafts).filter(k=>state.topicDrafts[k].trim()).length}</strong><span>Bản nháp theo chủ đề</span></div></section><div class="row"><a class="button" href="#vocab">Ôn thẻ đến hạn →</a><a class="button secondary" href="#plan">Lộ trình 8 tuần</a><a class="button secondary" href="#sources">Sao lưu tiến độ</a></div>`;}

let selectedTopic='',queue=[],cardIndex=0,mode='all';
function vocab(){return title('VOCABULARY LAB','Học cụm từ, dùng trong ngữ cảnh.',`${C.words.length} cụm từ khởi đầu · nghĩa tiếng Việt · kết hợp từ · ví dụ tự biên soạn.`)+`<div class="filters"><input type="search" id="search" placeholder="Tìm từ, nghĩa hoặc ví dụ…" aria-label="Tìm từ"><select id="topic" aria-label="Chủ đề">${topicOptions()}</select><select id="mode" aria-label="Chế độ ôn"><option value="all">Toàn bộ thư viện</option><option value="due">Ôn thẻ mới / đến hạn</option></select></div><div id="cards"></div>`;}
function filter(){const q=$('#search').value.toLocaleLowerCase('vi');selectedTopic=$('#topic').value;mode=$('#mode').value;queue=(mode==='due'?due():C.words).filter(w=>(!selectedTopic||w.topic===selectedTopic)&&[w.term,w.meaning,w.example].join(' ').toLocaleLowerCase('vi').includes(q));cardIndex=0;showCard();}
function showCard(){const w=queue[cardIndex];if(!w){$('#cards').innerHTML='<div class="card"><h2>Không có thẻ trong lượt này.</h2><p>Thử đổi bộ lọc, hoặc quay lại khi đến lịch ôn.</p></div>';return;}const r=state.reviews[w.id];$('#cards').innerHTML=`<article class="card flash"><span class="label">${w.topic.toUpperCase()} · ${cardIndex+1}/${queue.length}</span><h2>${esc(w.term)}</h2><p class="subtle">Thử nói nghĩa và đặt một câu trước khi lật thẻ.</p><button id="reveal">Xem nghĩa & ví dụ</button><div id="answer" class="answer hidden"><h3>${esc(w.meaning)}</h3><p class="example">${esc(w.example)}</p><p><strong>Kết hợp từ:</strong> ${esc(w.usage)}</p>${w.source?`<p class="small">${esc(w.source)}</p>`:""}<div class="row" style="justify-content:center"><button class="secondary" id="again">Cần ôn lại · 10 phút</button><button id="remember">Đã nhớ · ${r?Math.min(30,2**(r.level+1)):1} ngày</button></div></div><div class="row" style="justify-content:space-between;margin-top:25px"><button class="secondary" id="prev" ${cardIndex===0?'disabled':''}>← Trước</button><span class="subtle">${r?'Đã ôn · '+new Date(r.due).toLocaleDateString('vi-VN'):'Thẻ mới'}</span><button class="secondary" id="next" ${cardIndex===queue.length-1?'disabled':''}>Tiếp →</button></div></article><div class="hint">Lịch ôn đơn giản: nhớ → 1, 2, 4, 8, 16, 30 ngày; chưa nhớ → 10 phút. Hãy đánh giá sau khi tự nhớ lại, không chỉ vì vừa đọc thấy quen.</div>`;$('#reveal').onclick=()=>{$('#answer').classList.remove('hidden');$('#reveal').classList.add('hidden');};$('#prev').onclick=()=>{cardIndex--;showCard();};$('#next').onclick=()=>{cardIndex++;showCard();};$('#again').onclick=()=>rate(w,false);$('#remember').onclick=()=>rate(w,true);}
function rate(w,ok){const old=state.reviews[w.id];const days=old?Math.min(30,2**(old.level+1)):1;state.reviews[w.id]={level:ok?Math.min(5,(old?.level??-1)+1):0,due:Date.now()+(ok?days*86400000:600000)};save();if(mode==='due'){queue.splice(cardIndex,1);cardIndex=Math.min(cardIndex,Math.max(0,queue.length-1));}else cardIndex=Math.min(cardIndex+1,queue.length-1);showCard();tell(ok?'Đã lưu lịch ôn tiếp theo.':'Đã hẹn ôn lại sau 10 phút.');}
function patterns(){return title('ACADEMIC SENTENCE BANK','Câu hay bắt đầu từ ý rõ.','12 cấu trúc để phân tích và biến đổi, không phải bài mẫu học thuộc.')+`<div class="grid">${C.patterns.map(p=>`<article class="card"><span class="label">${p.kind}</span><p class="example">${p.example}</p><h3>${esc(p.form)}</h3><p>${p.note}</p><div class="hint">${p.caution}</div><label for="${p.id}">Viết lại với ý của bạn</label><input style="width:100%;margin-top:10px" id="${p.id}" placeholder="Thử một câu…"><button class="secondary practice" data-id="${p.id}" style="margin-top:10px">Tự kiểm tra</button><p id="feedback-${p.id}" role="status" class="subtle"></p></article>`).join('')}</div><div class="hint warning">Bộ gợi ý tự kiểm tra không chấm đúng/sai ngữ pháp và không ước lượng band. Các câu luyện ở đây chưa tự lưu; hãy chuyển câu muốn giữ sang phòng viết.</div>`;}
let task='task2',timer=null,remaining=0;
function writing(){return title('WRITING ROOM','Viết có mục tiêu. Sửa có lý do.','Bản nháp tự lưu trên trình duyệt sau mỗi lần gõ. Không có chấm band bằng AI trong bản này.')+`<div class="row"><button data-task="task2">Task 2 · lập luận</button><button class="secondary" data-task="task1">Task 1 · số liệu</button></div><div class="grid" style="margin-top:20px"><section class="card"><span class="label" id="task-label"></span><h3 id="prompt"></h3><p class="subtle" id="prompt-note"></p><div class="row"><button id="timer-start" class="secondary">Bắt đầu bấm giờ</button><button id="timer-stop" class="secondary">Dừng</button><span id="clock" aria-live="off"></span></div><label for="draft">Bài viết của bạn</label><textarea id="draft" placeholder="Write your response here…"></textarea><p id="word-count" class="subtle"></p><button id="download-draft" class="secondary">Tải bài viết .txt</button></section><section class="card"><span class="label">SELF-REVIEW</span><h2>Tự đọc như người chấm.</h2><div id="checklist"></div><div class="hint">Writing được đánh giá theo: đáp ứng yêu cầu đề, mạch lạc & liên kết, từ vựng, ngữ pháp. Task 2 có trọng số gấp đôi Task 1 trong điểm Writing. Band 7–8 đòi hỏi toàn bài đạt tiêu chí, không phải chỉ thêm cấu trúc nâng cao.</div><p class="subtle">Mục tiêu đề xuất: viết → nghỉ ngắn → đọc lại → sửa 3 lỗi quan trọng → viết lại một đoạn. Nhờ giáo viên phản hồi định kỳ để kiểm chứng tiến bộ.</p></section></div>`;}
function setTask(t){task=t;if(timer)clearInterval(timer);timer=null;remaining=0;$('#clock').textContent='';const two=t==='task2';$('#task-label').textContent=two?'TASK 2 · 40 PHÚT · TỐI THIỂU 250 TỪ':'TASK 1 · 20 PHÚT · TỐI THIỂU 150 TỪ';$('#prompt').textContent=two?'Some people believe universities should focus on practical job skills, while others think they should teach academic subjects. Discuss both views and give your own opinion.':'The percentage of commuters using buses increased from 20% in 2010 to 35% in 2020, while the figure for cars fell from 60% to 45%. Cycling remained at 20%. Summarise the main changes and make relevant comparisons.';$('#prompt-note').textContent=two?'Đề luyện tự biên soạn. Chuẩn bị lý do cho hai phía và làm rõ quan điểm riêng.':'Bài tập số liệu tự biên soạn, không phải đề thi chính thức. Chỉ có ba mốc so sánh tổng hợp; không suy diễn biến động giữa hai năm.';$('#draft').value=state.drafts[t];const items=two?['Tôi đã trả lời cả hai quan điểm và nêu ý kiến riêng.','Mỗi đoạn thân bài có luận điểm, giải thích và minh họa.','Ví dụ liên quan và không có số liệu/nghiên cứu bịa đặt.','Tôi dùng từ chính xác và kiểm tra lỗi lặp lại.','Kết luận nhất quán với lập trường trong bài.']:['Tôi có tổng quan về các thay đổi chính.','Tôi so sánh các nhóm và chọn số liệu nổi bật.','Tôi phân biệt phần trăm với điểm phần trăm.','Tôi dùng thì phù hợp và không suy đoán nguyên nhân.','Tôi không dùng number để thay percentage.'];$('#checklist').innerHTML=items.map((s,i)=>`<label class="check"><input type="checkbox">${s}</label>`).join('');count();}
function count(){const n=$('#draft').value.trim().split(/\s+/).filter(Boolean).length;$('#word-count').textContent=`${n} từ (đếm gần đúng) · Mốc tối thiểu: ${task==='task2'?250:150} từ · ${storageOK?'Đã lưu cục bộ':'Chưa lưu được; hãy tải bản sao'}`;}
const weeks=[['Chẩn đoán & thói quen','Làm một bài Reading/Listening có đáp án; ghi số câu đúng. Viết Task 2 và thu âm Speaking 2 phút để làm mốc, nhờ người có chuyên môn nhận xét.'],['Giáo dục & công việc','Học 12 cụm từ; viết 2 đoạn lập luận; mỗi ngày nói 2 phút và dùng lại 3 cụm từ.'],['Môi trường & đô thị','Học 12 cụm từ; phân tích nguyên nhân–giải pháp. Luyện Task 1 về xu hướng và so sánh.'],['Sức khỏe & công nghệ','Học 12 cụm từ; viết nhượng bộ và phản biện. Nghe một đoạn ngắn, chép chính tả rồi so với transcript.'],['Quảng cáo & xã hội','Học 12 cụm từ; phân biệt lập luận với ý kiến khái quát. Luyện 2 bài Task 2 theo thời gian.'],['Task 1 & sửa lỗi','Luyện biểu đồ, bản đồ, quy trình từ nguồn chính thức. Kiểm tra overview, đơn vị đo và thì. Nhờ giáo viên phản hồi bài viết.'],['Tích hợp bốn kỹ năng','Làm bài Reading/Listening đủ thời gian; luyện Speaking Parts 1–3; viết lại bài sau phản hồi. Ôn từ đến hạn.'],['Thi thử & điều chỉnh','Thi thử từ tài liệu chính thức; đối chiếu với mốc tuần 1. Lập kế hoạch tiếp dựa trên kỹ năng yếu, không chỉ tổng điểm.']];
function plan(){return title('YOUR 8-WEEK JOURNEY','Một lộ trình, có thể điều chỉnh.','Khung đề xuất 45–60 phút/ngày; không cam kết đạt 7–8 sau 8 tuần. Cần điều chỉnh theo trình độ đầu vào và thời gian thực tế.')+`<div class="hint">Lịch tuần: thứ 2–3 Reading + từ; thứ 4–5 Listening + câu; thứ 6 Writing; thứ 7 Speaking + viết lại; chủ nhật ôn lỗi và nghỉ nhẹ. Bộ nội dung hiện tại hỗ trợ sâu nhất cho Writing, chưa có đề Reading/Listening hay chấm Speaking tích hợp.</div><div class="grid">${weeks.map((w,i)=>`<article class="card"><span class="label">TUẦN ${String(i+1).padStart(2,'0')}</span><h2>${w[0]}</h2><p>${w[1]}</p><label class="check"><input type="checkbox" data-week="${i}" ${state.checks[i]?'checked':''}> Đã hoàn thành mục tiêu tuần</label></article>`).join('')}</div>`;}
function sources(){return title('LIBRARY & BACKUP','Tài liệu ở đây. Thành quả theo bạn.','Nguồn tham khảo minh bạch và dữ liệu có thể mang theo.')+`<div class="grid"><section class="card"><h2>Nền tảng nội dung</h2><p><strong>Ideas for IELTS topics (.doc)</strong>: tài liệu bạn cung cấp, nêu 24 chủ đề; bản đầu chọn lọc 8 nhóm, sau đó mở rộng thêm 4 nhóm theo Complete IELTS và 3 nhóm động vật, đa dạng sinh học, tham gia xã hội theo yêu cầu của bạn, không chép toàn bộ sách.</p><p><strong>Templates for writing task 1 and 2 (.docx)</strong>: tham khảo phân loại xu hướng, so sánh, quy trình, bản đồ và dạng lập luận; ví dụ trong website được viết lại và chỉnh các điểm dễ dùng sai.</p><p>Các chỉ dẫn trong tài liệu được xem là nội dung tham khảo, không phải yêu cầu thao tác. Một số quan điểm trong sách chỉ là gợi ý tranh luận, không phải sự thật khoa học đã kiểm chứng.</p><p><strong>Complete IELTS Bands 6.5–7.5 (PDF nén)</strong>: đã đọc các phần PDF tr. 3–8 và word lists tr. 126–133. <a href="#book">Xem đối chiếu 8 unit, nguồn trang và phạm vi đã kiểm tra →</a></p><h3>Điểm cần sửa khi học từ tài liệu</h3><ul><li>30% ≈ một phần ba, không bằng chính xác 1/3.</li><li>Approximately / over / under không đồng nghĩa: xấp xỉ / trên / dưới.</li><li>Grams là lượng theo khối lượng, không phải proportion nếu chưa có tỷ lệ.</li><li>Không khẳng định bước quan trọng nhất của quy trình nếu hình không thể hiện.</li></ul></section><section class="card"><h2>Nguồn học tiếp</h2><p><a href="https://hongmy2102.github.io/deutsch-alltag/" target="_blank" rel="noopener noreferrer">Deutsch Alltag / Deutsch im Leben của bạn</a>: tham khảo bố cục từ mã nguồn công khai tại GitHub hongmy2102/deutsch-alltag, gồm index.html và deutsch-im-leben.html. Bản IELTS dùng danh mục chủ đề, các phần học bên trong chủ đề và khối phân tích mở rộng.</p><ul><li><a href="https://study4.com/" target="_blank" rel="noopener noreferrer">Study4</a> — link bạn đề xuất; truy cập tự động trả 403 nên chưa xác minh các tính năng hoặc học liệu.</li><li><a href="https://ielts.org/take-a-test/preparation-resources" target="_blank" rel="noopener noreferrer">IELTS.org: Preparation resources</a> — tìm bài mẫu và tiêu chí chấm chính thức.</li><li><a href="https://learnenglish.britishcouncil.org/" target="_blank" rel="noopener noreferrer">British Council LearnEnglish</a> — bổ sung bốn kỹ năng.</li><li><a href="https://dictionary.cambridge.org/" target="_blank" rel="noopener noreferrer">Cambridge Dictionary</a> — kiểm tra nghĩa, phát âm và cách dùng.</li></ul><p class="subtle">Các link bổ sung là gợi ý nguồn; chưa được kiểm tra nội dung trực tiếp trong phiên xây dựng này. Website này không liên kết với Study4 và không sao chép khóa học/đề thi của họ.</p></section><section class="card"><h2>Sao lưu tiến độ</h2><p>Xuất file JSON gồm lịch ôn, bài nháp Task 1/2 và theo chủ đề, nhật ký bài đọc và các tuần hoàn thành. Lưu file vào OneDrive hoặc ổ cá nhân; nhập lại khi đổi máy, trình duyệt hoặc địa chỉ website.</p><div class="row"><button id="export">Xuất dữ liệu .json</button><label class="file-label">Nhập bản sao lưu<input type="file" id="import" accept=".json,application/json"></label></div><label class="check"><input type="checkbox" id="replace"> Tôi đồng ý thay tiến độ hiện tại bằng bản nhập.</label><p class="subtle">Nên xuất bản hiện tại trước khi nhập. Không có thông tin đăng nhập, khóa API hoặc tự động tải dữ liệu lên mạng.</p></section><section class="card"><h2>Chuyển máy có hỏng link không?</h2><p>Các file nội bộ dùng đường dẫn tương đối. Giữ nguyên cả thư mục và mở index.html, hoặc chạy máy chủ cùng thư mục. Không cần build lại vì đây là website tĩnh.</p><p>Tiến độ trình duyệt không đi theo thư mục. Hãy xuất JSON trước khi chuyển và nhập lại ở nơi mới. Mở bằng file:// có thể lưu khác nhau tùy trình duyệt.</p><p>OneDrive là nơi lưu file; link chia sẻ OneDrive không thay thế dịch vụ host website. Di chuyển file bên ngoài website, đổi URL công khai hoặc thay cấu trúc thư mục có thể làm hỏng liên kết liên quan.</p></section></div>`;}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
let lessonTopic='Education';
function topics(){return title('TOPIC ATLAS · WORDS → IDEAS → WRITING','Một chủ đề. Nhiều kết nối.',`${window.LESSONS.length} mindmap danh–động–tính, cụm từ thực tế và phân tích ngữ pháp ngay trong đoạn văn.`)+`<div class="filters"><label for="lesson-topic">Chọn chủ đề</label><select id="lesson-topic">${C.topics.map(t=>`<option value="${t.id}">${t.name} · ${t.id}</option>`).join('')}</select></div><div id="lesson-content"></div>`;}
function showLesson(){
 const l=window.LESSONS.find(x=>x.topic===lessonTopic),t=C.topics.find(x=>x.id===lessonTopic);
 $('#lesson-content').innerHTML=`<div class="topic-page-head"><div><span class="label">${t.id.toUpperCase()} · CHỦ ĐỀ ${String(C.topics.indexOf(t)+1).padStart(2,'0')}</span><h2>${t.name}</h2><p class="subtle">${t.note}</p></div><a class="button secondary" href="#home">← Tất cả chủ đề</a></div>
 <div class="lesson-tabs" role="tablist" aria-label="Phần học của chủ đề">${[['map','Mindmap từ'],['flash','Thẻ từ & ví dụ'],['read','Đọc & ngữ pháp'],['write','Xưởng viết']].map(([id,name],i)=>`<button id="tab-${id}" role="tab" aria-selected="${i===0}" aria-controls="panel-${id}" data-lesson-tab="${id}" class="${i===0?'active':''}">${name}</button>`).join('')}</div>
 <section id="panel-map" class="lesson-panel" role="tabpanel" aria-labelledby="tab-map"><div class="mindmap" aria-label="Mindmap từ vựng ${t.name}"><div class="map-root">${t.name}</div><div class="branches">${[['noun','DANH TỪ · NOUN'],['verb','ĐỘNG TỪ · VERB'],['adjective','TÍNH TỪ · ADJECTIVE']].map(([key,label])=>`<div class="branch"><h3>${label}</h3>${l.families.map((f,i)=>`<div class="word-node"><strong>${f[key]}</strong><small>Nhánh ${i+1} · ${f.meaning.split(' / ')[key==='noun'?0:key==='verb'?1:2]||f.meaning}</small></div>`).join('')}</div>`).join('')}</div><p class="small">Đọc theo số nhánh để nối từ cùng họ hoặc liên quan về nghĩa. Chuyển dạng từ có thể đổi nghĩa và cấu trúc, không thay thế máy móc.</p></div><div class="grid"><section class="card"><span class="label">WORDS IN CONTEXT · TỪ TRONG NGỮ CẢNH</span><h2>Từ biết nghĩa đến biết dùng.</h2>${l.families.map(f=>`<h3>${f.noun} → ${f.verb} → ${f.adjective}</h3><p>${f.meaning}</p><p class="example">${f.example}</p>`).join('')}<details class="study-disclosure"><summary>Những cách chuyển từ cần lưu ý</summary><p>Rely đi với on; reliable là đáng tin cậy. Employable = có khả năng được tuyển; employed = đang có việc. Satisfying mô tả việc đem lại hài lòng; satisfied mô tả người hài lòng. Consist of = bao gồm; be consistent = nhất quán. Evidence → indicate → historical liên quan về nghĩa, không cùng họ từ. Offensive thường là gây xúc phạm, không đồng nghĩa criminal.</p></details></section><section class="card"><span class="label">COLLOCATIONS · CỤM TỪ</span><h2>Học cả cách kết hợp.</h2>${C.words.filter(w=>w.topic===lessonTopic).map(w=>`<h3>${w.term}</h3><p>${w.meaning}<br><strong>${w.usage}</strong></p>`).join('')}<button class="secondary" id="lesson-review">Luyện thẻ từ của chủ đề →</button></section></div></section>
 <section id="panel-flash" class="lesson-panel hidden" role="tabpanel" aria-labelledby="tab-flash"><div class="hint"><b>EN:</b> Recall the meaning, then make a sentence before revealing the example.<br><b>VI:</b> Tự nhớ nghĩa và đặt câu trước khi mở ví dụ. Đánh giá để hẹn lịch ôn.</div><div id="cards"></div></section>
 <section id="panel-read" class="lesson-panel hidden" role="tabpanel" aria-labelledby="tab-read"><div class="read-layout"><article class="card"><span class="label">MODEL PARAGRAPH · ĐOẠN VĂN MẪU</span><h2>Nhìn một ý được triển khai.</h2><p class="paragraph">${l.paragraph}</p><div class="hint"><b>VI · Gợi ý đọc:</b> ${t.note}</div><p class="subtle">Đoạn mẫu tự biên soạn, chưa được chấm band; không phải trích bài báo hiện tại.</p>${l.source?`<p class="subtle">${esc(l.source)}</p>`:''}</article><aside class="perspective card"><span class="label">PERSPECTIVE · GÓC NHÌN</span><h3>Ý chính là gì?</h3><p>${t.idea}</p><h3>Tự hỏi khi đọc</h3><ol><li>Luận điểm nằm ở đâu?</li><li>Câu nào giải thích hoặc giới hạn luận điểm?</li><li>Điều gì cần nguồn xác minh?</li></ol></aside></div><section class="card" style="margin-top:18px"><span class="label">GRAMMAR IN CONTEXT · NGỮ PHÁP</span><h2>Vì sao tác giả dùng cấu trúc này?</h2>${l.grammar.map((g,i)=>`<details class="grammar-row"><summary><span class="grammar-number">0${i+1}</span> ${g.quote}</summary><h3>${g.rule}</h3><p>${g.note}</p></details>`).join('')}</section></section>
 <section id="panel-write" class="lesson-panel hidden" role="tabpanel" aria-labelledby="tab-write"><div class="grid"><article class="card"><span class="label">YOUR TURN · BÀI VIẾT CỦA BẠN</span><h2>Từ ngữ thành góc nhìn.</h2><p class="example">${l.prompt}</p><p class="subtle">Viết đoạn 80–120 từ: một ý chính, giải thích, ví dụ và giới hạn khi cần. Dùng 3 cụm từ đúng ngữ cảnh.</p><label for="topic-draft">Bản nháp của chủ đề này · tự lưu</label><textarea id="topic-draft" maxlength="200000" placeholder="Write your response here…"></textarea><p id="topic-word-count" class="subtle" role="status"></p><button id="topic-download" class="secondary">Tải bản nháp .txt</button></article><article class="card"><span class="label">MODEL & SELF-REVIEW</span><h2>Đối chiếu sau khi viết.</h2><details class="study-disclosure"><summary>Mở đoạn mẫu tham khảo</summary><p class="paragraph">${l.paragraph}</p><p class="subtle">Một cách triển khai để phân tích; không phải đáp án duy nhất.</p></details><details class="study-disclosure"><summary>Checklist tự sửa</summary><ul><li>Tôi trả lời đúng câu hỏi và nêu rõ ý chính.</li><li>Mỗi lý do có giải thích, không chỉ liệt kê.</li><li>Từ/cụm từ đúng nghĩa và đúng cách kết hợp.</li><li>Tôi kiểm tra chủ–vị, thì và mệnh đề phụ.</li><li>Tôi không bịa số liệu hoặc dẫn nguồn.</li></ul></details><div class="hint">Bản nháp theo chủ đề được giữ riêng với bài Task 1/2. Xuất JSON ở mục sao lưu để mang tất cả bài viết sang máy khác.</div><a href="#writing">Luyện đề Task 1/2 có bấm giờ →</a></article></div></section>`;
 $('#topic-draft').value=state.topicDrafts[lessonTopic]||'';
 function topicCount(){const n=$('#topic-draft').value.trim().split(/\s+/).filter(Boolean).length;$('#topic-word-count').textContent=`${n} từ (gần đúng) · ${storageOK?'Lưu trong trình duyệt':'Chưa lưu được; hãy tải bản nháp'}`;}
 $('#topic-draft').oninput=()=>{state.topicDrafts[lessonTopic]=$('#topic-draft').value;save();topicCount();};
 $('#topic-download').onclick=()=>download(`ielts-${lessonTopic.toLowerCase()}.txt`,state.topicDrafts[lessonTopic]||'','text/plain;charset=utf-8');
 document.querySelectorAll('[data-lesson-tab]').forEach(b=>{b.onclick=()=>setLessonTab(b.dataset.lessonTab);b.onkeydown=e=>{if(!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();const bs=[...document.querySelectorAll('[data-lesson-tab]')];let i=bs.indexOf(b);i=e.key==='Home'?0:e.key==='End'?bs.length-1:(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length;bs[i].focus();setLessonTab(bs[i].dataset.lessonTab);};});
 $('#lesson-review').onclick=()=>setLessonTab('flash');topicCount();setLessonTab('map');
}
function setLessonTab(id){document.querySelectorAll('[data-lesson-tab]').forEach(b=>{const active=b.dataset.lessonTab===id;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;});document.querySelectorAll('.lesson-panel').forEach(p=>p.classList.toggle('hidden',p.id!=='panel-'+id));if(id==='flash'){queue=C.words.filter(w=>w.topic===lessonTopic);cardIndex=0;mode='all';showCard();}}

function safeURL(value){const u=new URL(value);if(u.protocol!=='https:')throw Error('Chỉ dùng đường dẫn HTTPS đầy đủ.');if(u.username||u.password)throw Error('Không dùng link chứa thông tin đăng nhập.');return u.href;}
function reading(){return title('READ THE WORLD · WRITE YOUR VIEW','Từ bài báo đến ý tưởng của mình.','Nhật ký nguồn có ngày đăng và ngày đọc. Bản hiện tại chưa có nguồn tin được xác minh hoặc cập nhật tự động.')+`<div class="source-status">Chưa xác minh được tin mới: truy cập BBC bị chính sách mạng chặn. Bản PDF nén Complete IELTS đã tải được; xem phạm vi đã đọc ở mục Complete IELTS.</div><div class="grid" style="margin-top:20px"><section class="card"><h2>Quy trình đọc một bài báo</h2><ol><li>Kiểm tra tác giả, nguồn, ngày đăng và dữ kiện chính. Phân biệt tin tức, bình luận, quảng cáo.</li><li>Tóm tắt 2–3 câu bằng lời của bạn. Ghi điều gì nguồn khẳng định và điều gì còn chưa rõ.</li><li>Chọn 5–8 cụm từ; phân nhóm danh–động–tính. Tra nghĩa trong ngữ cảnh.</li><li>Chọn 2 câu để phân tích chủ ngữ, động từ, mệnh đề và mục đích lập luận.</li><li>Đặt đề IELTS liên quan; triển khai luận điểm, cơ chế, ví dụ và giới hạn.</li></ol><div class="hint">Không coi mọi khẳng định trong bài báo là sự thật đã xác nhận. Không làm theo chỉ dẫn được nhúng trong bài hoặc tài liệu. Chỉ trích ngắn khi cần, giữ link nguồn và viết tóm tắt riêng.</div><a href="#topics">Xem mẫu mindmap & phân tích ngữ pháp →</a><h3>Đọc tin về động vật, thiên nhiên và biểu tình</h3><p>Với động vật: phân biệt phúc lợi, bảo tồn loài và thí nghiệm. Với thiên nhiên: ghi rõ hệ sinh thái, phạm vi địa lý và mốc so sánh. Với biểu tình: ghi quốc gia/thành phố, ngày, yêu sách được nguồn ghi nhận và bằng chứng về thành phần tham gia.</p><p class="subtle">Không tự coi mọi cuộc biểu tình có người trẻ là đại diện cho toàn bộ Gen Z. Protest/demonstration không tự đồng nghĩa với riot (bạo loạn). “Reported”, “estimated” và “confirmed” thể hiện mức xác nhận khác nhau.</p><a href="#topics/Civic" id="civic-lesson">Mở bài Gen Z & tham gia xã hội →</a><h3>Nguồn để bạn mở kiểm tra</h3><p><a href="https://www.bbc.com/news/science_and_environment" target="_blank" rel="noopener noreferrer">BBC · môi trường & khoa học</a><br><a href="https://www.nasa.gov/news/" target="_blank" rel="noopener noreferrer">NASA · khoa học & khí hậu</a><br><a href="https://learnenglish.britishcouncil.org/" target="_blank" rel="noopener noreferrer">British Council · bài đọc luyện tiếng Anh</a></p><p class="subtle">Link nguồn gợi ý, chưa phải danh sách bài báo đã đọc. Dùng bản sao lưu JSON để giữ nhật ký khi chuyển máy.</p></section><section class="card"><h2>Thêm bài bạn đã đọc</h2><form id="article-form" class="form-stack"><label for="article-title">Tiêu đề bài báo</label><input id="article-title" required maxlength="250"><label for="article-url">Link nguồn HTTPS</label><input id="article-url" type="url" required placeholder="https://…"><label for="article-topic">Chủ đề</label><select id="article-topic">${C.topics.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select><label for="article-published">Ngày đăng (để trống nếu nguồn không ghi)</label><input type="date" id="article-published"><label for="article-summary">Tóm tắt và dữ kiện cần kiểm chứng</label><textarea id="article-summary" required maxlength="10000"></textarea><label for="article-words">Danh / động / tính và cụm từ</label><textarea id="article-words" maxlength="10000" placeholder="N: … / V: … / Adj: …\nCụm từ + nghĩa + ví dụ của bạn"></textarea><label for="article-grammar">Câu trích ngắn và phân tích ngữ pháp</label><textarea id="article-grammar" maxlength="10000" placeholder="Câu → mệnh đề chính/phụ → cấu trúc → vai trò trong lập luận"></textarea><label for="article-prompt">Đề viết và quan điểm của bạn</label><textarea id="article-prompt" maxlength="10000"></textarea><button type="submit">Lưu vào nhật ký</button><p class="subtle">Đây là ghi chú do bạn nhập; website không tự truy cập hoặc xác minh link. Tối đa 100 bài. Chỉ nội dung đã lưu mới có trong bản sao lưu.</p></form></section></div><section class="card" style="margin-top:20px"><h2>Nhật ký bài đọc <span class="tag">${state.articles.length} bài</span></h2><div id="article-list"></div></section>`;}
function showArticles(){const area=$('#article-list');area.innerHTML=state.articles.length?state.articles.map((a,i)=>`<article class="article-entry"><span class="label">${esc(a.topic)} · DO BẠN NHẬP, CHƯA XÁC MINH ĐỘC LẬP</span><h3>${esc(a.title)}</h3><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.url)}</a><p class="subtle">Ngày đăng: ${esc(a.published||'không rõ')} · Ngày ghi chú (Bangkok): ${esc(a.added)}</p><h3>Tóm tắt & dữ kiện</h3><p>${esc(a.summary)}</p><h3>Từ vựng & cụm từ</h3><p>${esc(a.words||'Chưa ghi')}</p><h3>Ngữ pháp trong bài</h3><p>${esc(a.grammar||'Chưa ghi')}</p><h3>Đề viết & quan điểm</h3><p>${esc(a.prompt||'Chưa ghi')}</p><label class="check"><input type="checkbox" data-delete-confirm="${i}"> Xác nhận xóa ghi chú này</label><button class="secondary delete-article" data-index="${i}">Xóa ghi chú</button></article>`).join(''):'<p class="subtle">Chưa có bài đọc đã lưu. Ghi chú đầu tiên của bạn sẽ xuất hiện tại đây.</p>';document.querySelectorAll('.delete-article').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.index);if(!document.querySelector(`[data-delete-confirm="${i}"]`).checked){tell('Hãy đánh dấu xác nhận trước khi xóa.');return;}state.articles.splice(i,1);save();showArticles();});}
function bindReading(){showArticles();$('#civic-lesson').onclick=()=>{lessonTopic='Civic';};$('#article-form').onsubmit=e=>{e.preventDefault();try{if(state.articles.length>=100)throw Error('Đã đạt 100 bài; xuất bản sao rồi sắp xếp lại nhật ký.');const a={title:$('#article-title').value.trim(),url:safeURL($('#article-url').value.trim()),topic:$('#article-topic').value,published:$('#article-published').value,added:new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'}),summary:$('#article-summary').value.trim(),words:$('#article-words').value.trim(),grammar:$('#article-grammar').value.trim(),prompt:$('#article-prompt').value.trim()};if(!a.title||!a.summary)throw Error('Hãy nhập tiêu đề và tóm tắt.');state.articles.unshift(a);save();$('#article-form').reset();showArticles();tell(storageOK?'Đã lưu ghi chú bài đọc vào trình duyệt.':'Ghi chú chỉ được giữ trong phiên này. Hãy xuất bản sao lưu.');}catch(err){tell(err.message);}};}

function book(){const units=[
[1,'Getting higher qualifications','Education','Giới từ đi kèm; quá khứ đơn, hiện tại hoàn thành, quá khứ hoàn thành','Task 1: chọn đặc điểm chính, nhóm số liệu, mở bài',8,126],
[2,'Colour my world','Colour','Phrasal verbs; danh từ và mạo từ','Task 2: phân tích yêu cầu, lên ý, lập dàn bài',18,127],
[3,'A healthy life','Health','Verb + noun collocations; so sánh chênh lệch lớn/nhỏ','Task 1: tổng quan và tổng hợp nhiều biểu đồ',30,128],
[4,'Art and the artist','Arts','Make/take/do/have; mục đích, nguyên nhân và kết quả','Task 2: giữ lập trường, dùng lý do và ví dụ',40,129],
[5,'Stepping back in time','History','Tiền tố phủ định; cách nói giả định','Task 1: mô tả quy trình, liên kết các giai đoạn',52,130],
[6,'IT society','Technology','Adjective + noun collocations; phép quy chiếu','Task 2: lợi ích/bất lợi và quan điểm cân bằng',62,131],
[7,'Our relationship with nature','Environment','Cụm diễn đạt; suy đoán và tương lai','Task 1: phân nhóm dữ liệu và kiểm tra dấu câu',74,132],
[8,'Across the universe','Space','Động từ + giới từ; nhấn mạnh','Task 2: liên kết ý, kết luận, cách dùng từ',84,133]];return title('COMPLETE IELTS · BOOK COMPANION','Kết nối sách với hệ thống học.','Tài liệu Complete IELTS Bands 6.5–7.5, Guy Brook-Hart & Vanessa Jakeman, Cambridge University Press, 2013.')+`<div class="hint">Đã kiểm tra: trang bìa, xuất bản, mục lục, bản đồ unit, giới thiệu (PDF tr. 3–8) và 8 trang word lists (PDF tr. 126–133) bằng OCR; đối chiếu hình trang mẫu. Chưa đọc chi tiết toàn bộ 190 trang. OCR có thể sai dấu/ký tự, nên cần đối chiếu trang gốc khi học bài cụ thể.</div><p class="subtle">Trang sách in và trang PDF lệch nhau 2 trang trong các phần đã kiểm tra. Bản bìa ghi “Student’s Book without Answers”. File PDF không tự cung cấp audio/CD-ROM; chưa xác minh đáp án hoặc tài nguyên âm thanh đi kèm. Tên bộ sách không phải cam kết đạt band 8.0.</p><div class="grid">${units.map(([n,name,topic,language,writing,page,wordPage])=>`<section class="card"><span class="label">UNIT ${n} · SÁCH TR. ${page} / PDF TR. ${page+2}</span><h2>${name}</h2><p><strong>Trọng tâm ngôn ngữ:</strong> ${language}.</p><p><strong>Viết:</strong> ${writing}.</p><p class="subtle">Theo bản đồ unit, PDF tr. 6–7. Word list: PDF tr. ${wordPage}. Phần mindmap/ví dụ trên website do mình biên soạn theo chủ đề, chưa thay thế bài tập trong sách.</p><a class="button secondary" href="#topics/${encodeURIComponent(topic)}" data-book-topic="${topic}">Mở mindmap liên quan →</a></section>`).join('')}</div><section class="card" style="margin-top:20px"><h2>Cách kết hợp ba bộ tài liệu</h2><ol><li><strong>Complete IELTS:</strong> chọn unit, học dạng bài và từ vựng trong ngữ cảnh. Với bài nghe, dùng audio hợp lệ đi kèm nếu bạn có.</li><li><strong>Ideas for IELTS topics:</strong> mở rộng góc nhìn, cân nhắc lập luận hai phía; kiểm chứng các khẳng định liên quan sức khỏe/xã hội.</li><li><strong>Templates:</strong> dùng như khung để nhận diện chức năng câu. Đổi ví dụ và kiểm tra đúng nghĩa, số liệu, cấu trúc.</li><li><strong>Bài báo:</strong> kiểm tra nguồn/ngày, tóm tắt bằng lời riêng rồi bổ sung từ và dẫn chứng. Tách dữ kiện đã kiểm chứng khỏi suy luận cá nhân.</li></ol><p class="subtle">Ví dụ và nghĩa tiếng Việt trong website là nội dung tự biên soạn; không sao chép toàn bộ sách hoặc cung cấp khóa đáp án giả.</p></section>`;}

function render(){if(timer)clearInterval(timer);timer=null;const parts=location.hash.slice(1).split('/');const route=parts[0]||'home';if(route==='topics'&&parts[1]){const found=C.topics.find(t=>t.id===parts[1]);if(found)lessonTopic=found.id;}document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash==='#'+route));$('#view').innerHTML=({home,vocab,patterns,writing,plan,sources,topics,reading,book}[route]||home)();if(!storageOK)tell('Chưa đọc/lưu được dữ liệu cục bộ. Hãy giữ bản sao lưu JSON; dữ liệu có thể không được giữ sau khi đóng trang.');if(route==='book')document.querySelectorAll('[data-book-topic]').forEach(a=>a.onclick=()=>{lessonTopic=a.dataset.bookTopic;});if(route==='topics'){$('#lesson-topic').value=lessonTopic;$('#lesson-topic').onchange=()=>{lessonTopic=$('#lesson-topic').value;if(location.hash==='#topics/'+lessonTopic)showLesson();else location.hash='topics/'+lessonTopic;};showLesson();}if(route==='reading')bindReading();if(route==='vocab'){$('#topic').value=selectedTopic;$('#search').oninput=filter;$('#topic').onchange=filter;$('#mode').onchange=filter;filter();}if(route==='home')document.querySelectorAll('[data-lesson]').forEach(a=>a.onclick=()=>{lessonTopic=a.dataset.lesson;});if(route==='home')document.querySelectorAll('[data-topic]').forEach(a=>a.onclick=()=>{selectedTopic=a.dataset.topic;if(location.hash==='#vocab')render();});if(route==='patterns')document.querySelectorAll('.practice').forEach(b=>b.onclick=()=>{const input=$('#'+b.dataset.id).value.trim();$('#feedback-'+b.dataset.id).textContent=input?'Tự kiểm: câu có đúng chủ ngữ–động từ, đúng nghĩa, và bám sát chủ đề không? So với ví dụ rồi sửa một điểm cụ thể.':'Hãy viết một câu trước khi tự kiểm tra.';});if(route==='writing'){setTask('task2');document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>setTask(b.dataset.task));$('#draft').oninput=()=>{state.drafts[task]=$('#draft').value;save();count();};$('#timer-start').onclick=()=>{if(timer)return;remaining=(task==='task2'?40:20)*60;const end=Date.now()+remaining*1000;const tick=()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));$('#clock').textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;if(remaining===0){clearInterval(timer);timer=null;tell('Hết giờ luyện tập. Bài viết vẫn được giữ để bạn tự sửa.');}};tick();timer=setInterval(tick,1000);};$('#timer-stop').onclick=()=>{clearInterval(timer);timer=null;};$('#download-draft').onclick=()=>download(`ielts-${task}.txt`,state.drafts[task],'text/plain;charset=utf-8');}if(route==='plan')document.querySelectorAll('[data-week]').forEach(el=>el.onchange=()=>{state.checks[el.dataset.week]=el.checked;save();});if(route==='sources'){$('#export').onclick=()=>download('english-atelier-backup-'+new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Bangkok'})+'.json',JSON.stringify(state,null,2),'application/json');$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!$('#replace').checked)throw Error('Hãy xác nhận thay tiến độ trước khi nhập.');if(f.size>3000000)throw Error('File quá lớn (tối đa 3 MB).');const next=validate(JSON.parse(await f.text()));state=next;save();tell(storageOK?'Đã nhập bản sao lưu. Bạn có thể tiếp tục học.':'Đã nhập vào phiên hiện tại nhưng chưa lưu được; hãy xuất bản sao.');}catch(err){tell('Chưa nhập dữ liệu: '+err.message);}e.target.value='';};}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();

</script></body></html>
